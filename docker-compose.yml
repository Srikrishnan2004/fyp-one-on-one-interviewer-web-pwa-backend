version: '3.8'

services:
  # Coding challenge environment
  coding-environment:
    build: 
      context: .
      args:
        USERNAME: coder
        USER_GID: 2000
    container_name: coding-challenge-env
    ports:
      - "4000:4000"  # Coding challenge server
    volumes:
      - .:/app
    environment:
      - NODE_ENV=production
      - PYTHONPATH=/app
      - JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - USER=coder
    working_dir: /app
    user: coder
    command: /bin/bash
    stdin_open: true
    tty: true
    networks:
      - dev-network

  # PostgreSQL database (if needed)
  postgres:
    image: postgres:15
    container_name: virtual-interviewer-postgres
    environment:
      POSTGRES_DB: virtual_interviewer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dev-network

  # Redis (for caching/sessions)
  redis:
    image: redis:7-alpine
    container_name: virtual-interviewer-redis
    ports:
      - "6379:6379"
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  postgres_data:
